# fly.toml app configuration file generated for cartstack on 2026-05-21T19:36:48Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cartstack'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  ASPNETCORE_ENVIRONMENT = 'Production'
  ConnectionStrings__Db = 'Data Source=/data/app.db'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
